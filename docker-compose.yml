services:
  mozart-ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mozart-ai-generator
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      # Point the API at the sidecar. Comment this out (or run without the
      # separator profile) and the app transcribes the original mix, exactly
      # as it did before separation existed.
      - SEPARATOR_URL=http://vocal-separator:8000
    depends_on:
      vocal-separator:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${PORT:-3000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Vocal stem isolation (Demucs). Opt-in via the "separation" profile:
  #   docker compose --profile separation up
  # It is a separate image because PyTorch ships no musl wheels, so torch
  # cannot be installed into the API's alpine image at all — and the built
  # image is multi-gigabyte, which the API image should not become.
  vocal-separator:
    build:
      context: ./services/separator
      dockerfile: Dockerfile
    container_name: mozart-vocal-separator
    restart: unless-stopped
    profiles: ["separation"]
    environment:
      - DEMUCS_MODEL=${DEMUCS_MODEL:-htdemucs}
      - DEMUCS_TIMEOUT_S=${DEMUCS_TIMEOUT_S:-300}
    # Not published on the host: only the API needs to reach it.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      # Model load on a cold container is slow; do not flap before it is up.
      start_period: 120s
